name: Sync Lab Guide to ciscodocs

on:
  push:
    branches:
      - main
    paths:
      - 'lab-guide/docs/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Clone target repository
        env:
          CISCODOCS_PAT: ${{ secrets.CISCODOCS_PAT }}
        run: |
          git clone https://x-access-token:${CISCODOCS_PAT}@github.com/ciscodocs/ltrai-1487-clemea26.git target-repo
      
      - name: Sync docs directory
        run: |
          # Use rsync to sync docs, preserving any files in target that don't exist in source
          # This ensures overrides and other ciscodocs-specific files are preserved
          rsync -av --delete \
            --exclude='.git' \
            lab-guide/docs/ target-repo/docs/

          # Ensure overrides directory exists (required by ciscodocs mkdocs.yml)
          mkdir -p target-repo/docs/overrides

          # Navigate to target repo
          cd target-repo

          # Check if there are changes
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected, committing..."
            git add docs/
            git commit -m "Sync lab guide from ciscomanagedservices/ciscolive26_cw_ai_agents@${GITHUB_SHA:0:7}" \
              -m "Triggered by: ${GITHUB_ACTOR}" \
              -m "Source commit: ${GITHUB_SHA}"
            git push origin main
            echo "Successfully synced docs to ciscodocs repository"
          else
            echo "No changes to sync"
          fi

